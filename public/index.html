<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCR — Diccionario de Construcción y Régimen</title>
  <meta name="description" content="Visualizador del Diccionario de Construcción y Régimen de la Lengua Castellana de Rufino José Cuervo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ── TOP NAVIGATION ─────────────────────────────────────────────── -->
  <nav class="top-nav" id="top-nav" role="navigation" aria-label="Menú principal">
    <div class="nav-brand">
      <button class="hamburger" id="hamburger-btn" aria-label="Menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <span class="nav-title">DCR · Cuervo</span>
    </div>
    <ul class="nav-links" id="nav-links" role="list">
      <li><a href="#" class="nav-link active" data-view="dictionary" id="nav-dictionary">Diccionario</a></li>
      <li><a href="#" class="nav-link" data-view="introduccion">Introducción</a></li>
      <li><a href="#" class="nav-link" data-view="caracteristicas">Características</a></li>
      <li><a href="#" class="nav-link" data-view="historia">Historia</a></li>
      <li><a href="#" class="nav-link" data-view="biografia">Biografía</a></li>
      <li><a href="#" class="nav-link" data-view="abreviaturas">Abreviaturas</a></li>
      <li><a href="#" class="nav-link" data-view="bibliografia">Bibliografía</a></li>
      <li><a href="#" class="nav-link" data-view="signos">Signos</a></li>
      <li><a href="#" class="nav-link" data-view="nomina">Nómina</a></li>
      <li><a href="#" class="nav-link" data-view="creditos">Créditos</a></li>
    </ul>
  </nav>

  <!-- ── DICTIONARY VIEW ────────────────────────────────────────────── -->
  <div class="view-panel active" id="view-dictionary">
    <aside class="sidebar" id="sidebar" aria-label="Navegación de lemas">

      <!-- Search -->
      <div class="search-wrap">
        <label for="search-input" class="sr-only">Buscar lema</label>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M15 15l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="search" id="search-input" placeholder="Buscar lema…" autocomplete="off" spellcheck="false">
          <button class="clear-btn" id="clear-search" aria-label="Limpiar búsqueda" hidden>×</button>
        </div>
        <!-- Autocomplete dropdown -->
        <ul class="autocomplete-list" id="autocomplete-list" role="listbox" aria-label="Sugerencias" hidden></ul>
      </div>

      <!-- A–Z tabs -->
      <div class="az-tabs" role="tablist" aria-label="Filtrar por letra">
        <button class="az-tab active" data-letter="all" role="tab" aria-selected="true">Todos</button>
        <!-- Generated by JS -->
      </div>

      <!-- Lemma list -->
      <div class="lemma-list-wrap">
        <ul class="lemma-list" id="lemma-list" role="list" aria-label="Lista de lemas"></ul>
        <div class="pagination" id="pagination"></div>
      </div>
    </aside>

    <!-- Main article panel -->
    <main class="main-content" id="article-panel" aria-live="polite">
      <div class="article-placeholder" id="article-placeholder">
        <div class="placeholder-icon">📖</div>
        <p>Selecciona un lema del panel izquierdo<br>o utiliza el buscador para encontrar una entrada.</p>
      </div>
      <article class="article-content" id="article-content" hidden></article>
    </main>
  </div>

  <!-- ── CONTEXTUAL VIEW (Introducción, Historia, etc.) ────────────── -->
  <div class="view-panel" id="view-contextual" hidden>
    <div class="contextual-wrap">
      <iframe id="contextual-frame" class="contextual-frame" title="Contenido contextual" src="about:blank"></iframe>
    </div>
  </div>

  <!-- ── POPOVER (for author/abbreviation info) ────────────────────── -->
  <div class="popover" id="popover" role="tooltip" hidden>
    <button class="popover-close" id="popover-close" aria-label="Cerrar">×</button>
    <div class="popover-type" id="popover-type"></div>
    <div class="popover-abbrev" id="popover-abbrev"></div>
    <div class="popover-expansion" id="popover-expansion"></div>
  </div>
  <div class="popover-backdrop" id="popover-backdrop" hidden></div>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
